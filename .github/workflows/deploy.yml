# 전국 학과 지도 — GitHub Pages 배포
#
# 푸시마다 시험 → 문법 검사 → 빌드 → 결과 점검을 돌리고 Pages 에 올린다.
# dist/ 는 커밋하지 않는다 (여기서 만든다).
#
# ⚠ 저장소 Settings → Pages → Source 가 「GitHub Actions」 여야 한다.
#   「Deploy from a branch」 로 두면 빌드 안 한 원본이 서비스되어 흰 화면이 된다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 시험
        run: npm test

      - name: 문법·규칙 전수 검사
        # ⚠ 시험은 탭 파일(DOM)을 부르지 않는다. 이 단계를 빼면
        #   탭 파일의 문법 오류가 빌드에서야 터진다. 빼지 말 것.
        run: npm run check:syntax

      - name: 빌드
        run: npm run build

      - name: 빌드 결과 점검
        # ⚠ 셸 변수 이름은 반드시 ASCII. 한글로 지으면 bash 가 command not found 로 죽는다.
        run: |
          set -e
          test -f dist/index.html || { echo "✗ dist/index.html 이 없다"; exit 1; }
          size=$(wc -c < dist/index.html)
          echo "크기: ${size} 바이트"
          test "$size" -gt 300000 || { echo "✗ 너무 작다 — 자료가 안 들어갔다"; exit 1; }
          grep -q '티쳐무' dist/index.html || { echo "✗ 저작권 표시가 없다"; exit 1; }
          grep -q '대학알리미' dist/index.html || { echo "✗ 원자료 출처 표시가 없다"; exit 1; }
          grep -q '모든 권리 보유' dist/index.html || { echo "✗ 배너가 지워졌다"; exit 1; }
          echo "✓ 점검 통과"

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
